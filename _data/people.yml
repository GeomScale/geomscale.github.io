# People shown on /community/.
#
# Main contributors: people who wrote a feature that ships in a GeomScale package
# (merged, user-visible, still in the code), or co-authored dingo or PorQua. One line
# each, naming the contribution. The final list is the maintainer's call.
# Everyone who completed a GSoC project is credited in _data/gsoc.yml.

