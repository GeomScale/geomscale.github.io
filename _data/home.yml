# Content of the home page (index.html).
tagline: Open-source software for sampling and volume computation in high dimensions.
intro: >-
  Many problems have not one answer but a space of feasible answers: every flux distribution a cell
  can sustain, every portfolio that meets its constraints. GeomScale builds fast, tested, open
  software that explores these spaces, drawing random samples from them and measuring their size,
  in thousands of dimensions.

